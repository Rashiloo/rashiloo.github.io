<ul *ngFor="let job of workExperience;">
  <li>
    {{ job.startDate }} - {{ job.endDate }} <i>{{job.location}}</i> <br>
    <b> {{ job.position }} </b> <br>
    {{ job.company }} <br>
    Logros: <br>
    <ul *ngFor="let item of job.accomplishments;">
      <li>{{ item }}</li>
    </ul>
  </li>
</ul>
